name: Refresh season data

# Fetches the live season's finished games from the NBA's public CDN (scripts/fetch-cdn.ts) and
# commits data/raw/<season>.json to milestones-1-3. Mondays, so the week that just ended unlocks.
#
# GitHub only runs schedules from the default branch (main): the schedule starts once this file
# is on main. Until then, run it from the Actions tab (Run workflow), or push a change to the
# fetcher or this file on milestones-1-3.
on:
  schedule:
    - cron: '17 11 * * 1' # Mondays 11:17 UTC (6:17 or 7:17 Eastern), after Sunday's late games
  workflow_dispatch:
  push:
    branches: [milestones-1-3]
    paths: [.github/workflows/refresh-data.yml, scripts/fetch-cdn.ts, scripts/cdn-lib.ts]

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestones-1-3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch finished games
        id: fetch
        run: npx tsx scripts/fetch-cdn.ts --refresh-days 7
      - name: Check the data builds
        run: npm run data:build
      - name: Commit
        run: |
          git add data/raw
          if git diff --cached --quiet; then
            echo "No new games."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "Season data: ${{ steps.fetch.outputs.season }} games through ${{ steps.fetch.outputs.through }}"
          git pull --rebase origin milestones-1-3
          git push origin HEAD:milestones-1-3
