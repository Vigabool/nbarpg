name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Formatting
        run: npm run format:check
      - name: Tests
        run: npm test
      - name: Build season data
        run: npm run data:build
      - name: Build
        run: npm run build
      - name: Golden baseline (battle results unchanged)
        run: npm run check:golden
